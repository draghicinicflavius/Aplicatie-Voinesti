<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versuri Cor</title>

    <style>
        body { 
            font-family: sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 320px; 
            text-align: center; 
        }
        h2 { color: #2196F3; margin-top: 0; margin-bottom: 25px; }
        
        .btn-access {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .btn-member { background-color: #4CAF50; color: white; }
        .btn-member:hover { background-color: #45a049; }
        
        .btn-dirijor { background-color: #2196F3; color: white; }
        .btn-dirijor:hover { background-color: #1976D2; }

        .admin-link {
            display: inline-block;
            margin-top: 25px;
            color: #888;
            font-size: 12px;
            text-decoration: none;
            font-weight: 500;
        }
        .admin-link:hover { color: #333; text-decoration: underline; }

        .footer-branding {
            margin-top: 15px;
            font-size: 11px;
            color: #bbb;
        }
    </style>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#004d40">
    <link rel="apple-touch-icon" href="/images/icon-512.png">
</head>
<body>
    <div class="container">
        <h2>🎼 Voinești Versuri 🎼</h2>
        
        <!-- BUTOANELE PRINCIPALE PENTRU UTILIZATORI (FĂRĂ POP-UP DE PAROLĂ) -->
        <a href="/live" class="btn-access btn-member">
            🎶 Vezi Versurile (Membri)
        </a>
        <a href="/" class="btn-access btn-dirijor">
            🎼 Interfață Dirijor
        </a>

        <!-- LINK DISCRET DE ADMIN JOS -->
        <div>
            <a href="/admin-login" class="admin-link">🔒 Admin (Flavius)</a>
        </div>

        <div class="footer-branding">
            by Flavius Draghici
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>
</body>
</html>
